name: Deploy WoW Guild Tracker to production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wowguildtracker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false

      # This app uses only Node built-ins; no install or compilation is needed.
      - name: Run tests
        run: node --test

      - name: Package runtime files
        run: git archive --format=zip --output=app.zip HEAD server.js package.json lib public

      # References from the successful production run 35225691393.
      # Keep these aligned with the identity that has access to the App Service.
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7D6510E1680242EF897D37AF598ABB6B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E1CE81B24BCF4A2E8E3BDAC2327C18CE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_77F6BE8861144E97B636210B64CCB212 }}

      - name: Deploy to production
        uses: azure/webapps-deploy@v3
        with:
          app-name: WoWGuildTracker
          slot-name: production
          package: app.zip
