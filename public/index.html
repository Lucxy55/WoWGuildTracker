<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guild Ledger</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><header><a href="/" class="brand"><span class="crest">G</span><span>GUILD LEDGER<small>A WORLD OF WARCRAFT COMPANION</small></span></a><nav><a class="calendar-link" href="/calendar" aria-label="Guild calendar" title="Guild calendar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 11h18M7 15h3M14 15h3M7 18h3"/></svg></a><label for="game">Game</label><select id="game"><option value="retail">World of Warcraft · Retail</option><option value="forever">Warcraft Forever</option></select><button id="owner-toggle">Owner access</button></nav></header>
